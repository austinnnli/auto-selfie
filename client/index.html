<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Framing Rover</title>
<style>
  :root {
    --bg: #0b0d10; --fg: #e8eaed; --dim: #8b93a1;
    --ok: #35c46a; --warn: #f0b429; --bad: #e5484d; --line: #1e242c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overscroll-behavior: none; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

  /* C-1.3: a large running indicator, so a blanked screen is obvious from
     across the room. */
  #banner { flex: 0 0 auto; padding: 18px 16px; text-align: center;
    font-size: 26px; font-weight: 650; letter-spacing: -0.02em;
    background: #16181d; border-bottom: 1px solid var(--line); }
  #banner.running { background: #0f2a18; color: var(--ok); }
  #banner.error   { background: #2a1214; color: var(--bad); }

  #stage { position: relative; flex: 1 1 auto; min-height: 0; background: #000; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }

  /* C-7: latency and frame rate on screen, visible at a glance from across
     the room - the numbers that tell you the pipeline is healthy. */
  #hud { position: absolute; left: 0; right: 0; bottom: 0; display: flex;
    gap: 2px; padding: 8px; font-variant-numeric: tabular-nums; }
  .cell { flex: 1; background: rgba(8,10,13,.82); border-radius: 8px;
    padding: 7px 4px; text-align: center; }
  .cell b { display: block; font-size: 19px; font-weight: 650; }
  .cell span { font-size: 10px; color: var(--dim); text-transform: uppercase;
    letter-spacing: .07em; }
  .ok b { color: var(--ok); } .warn b { color: var(--warn); } .bad b { color: var(--bad); }

  #controls { flex: 0 0 auto; padding: 12px 16px 16px; border-top: 1px solid var(--line); }
  button { width: 100%; padding: 17px; font-size: 18px; font-weight: 600;
    color: var(--fg); background: #222831; border: 1px solid #2e3743;
    border-radius: 12px; }
  button:active { background: #2b323c; }
  button.primary { background: #1d4ed8; border-color: #2a5ce0; }
  #log { margin-top: 10px; max-height: 84px; overflow-y: auto; font-size: 12px;
    color: var(--dim); font-family: ui-monospace, Menlo, monospace; }
  #said { margin-top: 10px; font-size: 17px; min-height: 22px; color: var(--fg); }
</style>
</head>
<body>

<div id="banner">Tap to start</div>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <div id="hud">
    <div class="cell" id="c-link"><b id="v-link">--</b><span>link</span></div>
    <div class="cell" id="c-fps"><b id="v-fps">--</b><span>fps</span></div>
    <div class="cell" id="c-lat"><b id="v-lat">--</b><span>latency</span></div>
    <div class="cell" id="c-drop"><b id="v-drop">--</b><span>skipped</span></div>
    <div class="cell" id="c-res"><b id="v-res">--</b><span>capture</span></div>
  </div>
</div>

<div id="controls">
  <button id="start" class="primary">Start</button>
  <div id="said"></div>
  <div id="log"></div>
</div>

<script>
"use strict";
/* D2 phone client.  One file, served by the laptop over HTTPS, opened in
 * Safari.  It captures, it reports, it speaks - it decides nothing.
 *
 * C-6 is the constraint that shapes everything: camera access needs a secure
 * origin, and a secure origin cannot open a plain WebSocket, so this page is
 * served over HTTPS with a self-signed certificate and the socket is wss:// on
 * the same origin.  If Safari refuses the camera after the warning is
 * accepted, stop and fall back to an RTSP app (and lose motion and speech).
 */

const CONFIG = {
  frameHz: 12,          // C-2, 10-15
  workWidth: 480,       // the width perception actually runs at
  quality: 0.6,         // JPEG quality, overridable by the laptop (W-4)
  motionHz: 50,         // C-3
  reconnectMax: 8000,
};

const el = (id) => document.getElementById(id);
const video = el("video");

let ws = null, wsReady = false, reconnectDelay = 500;
let stream = null, track = null, wakeLock = null;
let running = false;
let canvas = null, ctx = null;
let sending = false;
let framesSent = 0, framesSkipped = 0, lastFpsAt = 0, lastFpsCount = 0;
let lastMotionSent = 0;
let latencyMs = null;
let recognizer = null;
let nativeSize = {w: 0, h: 0};

/* One clock for everything this page sends.  performance.now() is monotonic
 * and shared by the frame timestamps and the motion samples, which is exactly
 * what the laptop's alignment (P-2) needs - it maps this clock onto its own
 * once, with the ping-pong exchange below. */
const now = () => performance.now();

function log(msg) {
  const box = el("log");
  const line = document.createElement("div");
  line.textContent = new Date().toLocaleTimeString() + "  " + msg;
  box.insertBefore(line, box.firstChild);
  while (box.childNodes.length > 40) box.removeChild(box.lastChild);
}

function setBanner(text, cls) {
  const b = el("banner");
  b.textContent = text;
  b.className = cls || "";
}

function setCell(id, value, cls) {
  el("v-" + id).textContent = value;
  el("c-" + id).className = "cell " + (cls || "");
}

/* ---------------------------------------------------------------- */
/* C-1  startup sequence                                            */
/* ---------------------------------------------------------------- */

async function startCamera() {
  /* Ask for the highest resolution the device will negotiate... */
  const constraints = {
    audio: false,
    video: {
      facingMode: {ideal: "environment"},
      width: {ideal: 3840},
      height: {ideal: 2160},
      frameRate: {ideal: 30},
    },
  };
  stream = await navigator.mediaDevices.getUserMedia(constraints);
  track = stream.getVideoTracks()[0];
  video.srcObject = stream;
  await video.play();

  /* ...then READ BACK what we actually got.  Constraints fall back silently:
   * ask for 4K on a phone that will only give 1080p and it hands you 1080p
   * without a word.  Every normalised coordinate downstream depends on this
   * number being the real one (C-1.1). */
  await new Promise((resolve) => {
    if (video.videoWidth) return resolve();
    video.onloadedmetadata = resolve;
  });
  nativeSize = {w: video.videoWidth, h: video.videoHeight};
  setCell("res", nativeSize.w + "p", "ok");
  log(`camera: asked 3840x2160, negotiated ${nativeSize.w}x${nativeSize.h}`);
}

async function requestMotion() {
  /* C-1.2: must be triggered by a user tap, which is why everything happens
   * inside the Start button's handler. */
  const DME = window.DeviceMotionEvent;
  if (DME && typeof DME.requestPermission === "function") {
    const res = await DME.requestPermission();
    if (res !== "granted") throw new Error("motion permission denied");
  }
  const DOE = window.DeviceOrientationEvent;
  if (DOE && typeof DOE.requestPermission === "function") {
    await DOE.requestPermission().catch(() => {});
  }
  window.addEventListener("devicemotion", onMotion, {passive: true});
  window.addEventListener("deviceorientation", onOrientation, {passive: true});
  log("motion sensors granted");
}

async function acquireWakeLock() {
  /* C-1.3.  A phone that sleeps mid-run looks exactly like a crashed laptop. */
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => log("wake lock released"));
      document.addEventListener("visibilitychange", async () => {
        if (document.visibilityState === "visible" && running) {
          try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
        }
      });
      log("wake lock held");
    } else {
      log("no wake lock API - keep the screen on manually");
    }
  } catch (e) {
    log("wake lock refused: " + e.message);
  }
}

/* ---------------------------------------------------------------- */
/* the socket                                                       */
/* ---------------------------------------------------------------- */

function connect() {
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
  ws = new WebSocket(url);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    wsReady = true;
    reconnectDelay = 500;
    setCell("link", "up", "ok");
    log("socket open");
    /* C-1.4: hello with the NEGOTIATED resolution, so the laptop can compute
     * normalised coordinates correctly. */
    send({
      type: "hello",
      videoWidth: nativeSize.w, videoHeight: nativeSize.h,
      workWidth: CONFIG.workWidth, frameHz: CONFIG.frameHz,
      ua: navigator.userAgent,
    });
  };

  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.type === "ping") {
      /* P-2's clock offset exchange. */
      send({type: "pong", t_send: msg.t_send, t_phone: now()});
      return;
    }
    if (typeof msg.say === "string") speak(msg.say);
    if (msg.capture) doCapture();
    if (typeof msg.quality === "number") {
      CONFIG.quality = Math.max(0.2, Math.min(0.95, msg.quality));
      log("quality -> " + CONFIG.quality);
    }
    if (msg.stop) stopRun("laptop asked to stop");
  };

  ws.onclose = () => {
    wsReady = false;
    setCell("link", "down", "bad");
    /* C-7: reconnect with backoff.  Capture keeps running and frames are
     * DISCARDED rather than buffered - a reconnect that then floods the
     * laptop with ten seconds of stale frames is worse than the gap. */
    if (running) {
      log(`socket closed, retrying in ${reconnectDelay} ms`);
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(CONFIG.reconnectMax, reconnectDelay * 2);
    }
  };

  ws.onerror = () => setCell("link", "err", "bad");
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

/* ---------------------------------------------------------------- */
/* C-2  capture loop                                                */
/* ---------------------------------------------------------------- */

function frameBudgetBytes() {
  /* One frame's worth of slack.  A 480px JPEG at q0.6 is 20-40 kB. */
  return 60000;
}

async function captureFrame() {
  if (!running || sending) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) { framesSkipped++; return; }

  /* NEVER QUEUE.  If the socket has not drained the previous frame, skip this
   * one rather than falling behind.  Dropped frames are fine; late frames are
   * poison - they turn into latency that climbs all session and silently
   * invalidates every gain tuned after it starts. */
  if (ws.bufferedAmount > frameBudgetBytes()) { framesSkipped++; return; }

  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;

  const w = CONFIG.workWidth;
  const h = Math.round(vh * (w / vw));
  if (!canvas || canvas.width !== w || canvas.height !== h) {
    canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    ctx = canvas.getContext("2d", {alpha: false, desynchronized: true});
  }

  sending = true;
  const t = now();
  ctx.drawImage(video, 0, 0, w, h);
  canvas.toBlob(async (blob) => {
    try {
      if (blob && ws && ws.readyState === WebSocket.OPEN) {
        const bytes = new Uint8Array(await blob.arrayBuffer());
        /* W-3 frame: 8-byte phone timestamp, then JPEG bytes. */
        const out = new Uint8Array(8 + bytes.length);
        new DataView(out.buffer).setFloat64(0, t, true);
        out.set(bytes, 8);
        ws.send(out.buffer);
        framesSent++;
      }
    } catch (e) {
      framesSkipped++;
    } finally {
      sending = false;
    }
  }, "image/jpeg", CONFIG.quality);
}

/* ---------------------------------------------------------------- */
/* C-3  motion loop                                                 */
/* ---------------------------------------------------------------- */

let motion = {rate_z: 0, pitch: 0, roll: 0, ax: 0, ay: 0, az: 0};

function onMotion(ev) {
  const r = ev.rotationRate;
  if (r) motion.rate_z = r.alpha || 0;   /* deg/s about the screen normal */

  /* C-3: pitch and roll come from the GRAVITY vector, not from the integrated
   * orientation - gravity is absolute and drift-free, and pitch is the tilt
   * feedback the firmware cannot provide (H-4.3, D-9). */
  const g = ev.accelerationIncludingGravity;
  if (g) {
    motion.ax = g.x || 0; motion.ay = g.y || 0; motion.az = g.z || 0;
    const norm = Math.hypot(g.x || 0, g.y || 0, g.z || 0) || 1;
    motion.pitch = Math.atan2(-(g.z || 0), Math.hypot(g.x || 0, g.y || 0)) * 180 / Math.PI;
    motion.roll = Math.atan2(g.x || 0, g.y || 0) * 180 / Math.PI;
    if (Math.abs(norm - 9.81) > 6) return;   /* shaken; this sample is noise */
  }
  maybeSendMotion();
}

function onOrientation(ev) {
  /* A second opinion on pitch where the browser provides it.  Kept only as a
   * cross-check: the gravity vector above is the one the control loop uses. */
  if (typeof ev.beta === "number" && Math.abs(ev.beta) < 179) {
    motion.beta = ev.beta;
  }
}

function maybeSendMotion() {
  const t = now();
  if (t - lastMotionSent < 1000 / CONFIG.motionHz) return;   /* throttle to 50 Hz */
  lastMotionSent = t;
  send({type: "motion", t: t, rate_z: motion.rate_z,
        pitch: motion.pitch, roll: motion.roll,
        ax: motion.ax, ay: motion.ay, az: motion.az});
}

/* ---------------------------------------------------------------- */
/* C-4  speech out                                                  */
/* ---------------------------------------------------------------- */

function speak(text) {
  el("said").textContent = text;
  if (!("speechSynthesis" in window)) return;
  /* Cancel anything currently speaking.  Cues queue up otherwise, and the
   * subject ends up acting on an instruction from four seconds ago. */
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1.05;
  utter.pitch = 1.0;
  window.speechSynthesis.speak(utter);
}

/* ---------------------------------------------------------------- */
/* G-1  speech in: the page recognises, the laptop parses           */
/* ---------------------------------------------------------------- */

function startRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { log("no speech recognition - use the tap trigger"); return; }
  recognizer = new SR();
  recognizer.lang = "en-GB";
  recognizer.continuous = true;
  recognizer.interimResults = false;

  recognizer.onresult = (ev) => {
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      if (!ev.results[i].isFinal) continue;
      const text = ev.results[i][0].transcript.trim();
      const conf = ev.results[i][0].confidence;
      if (!text) continue;
      el("said").textContent = "“" + text + "”";
      /* The laptop does the parsing (G-1).  The page never classifies. */
      send({type: "transcript", text: text, confidence: conf});
    }
  };
  recognizer.onerror = (e) => log("recognition: " + e.error);
  recognizer.onend = () => { if (running) { try { recognizer.start(); } catch (e) {} } };
  try { recognizer.start(); log("listening for a goal"); } catch (e) {}
}

/* ---------------------------------------------------------------- */
/* C-5  full-resolution capture                                     */
/* ---------------------------------------------------------------- */

async function doCapture() {
  /* KNOWN LIMIT: Safari has never supported the ImageCapture API, so this is
   * a canvas grab at video resolution - typically 1080p to 4K, without
   * Apple's computational photography.  Accepted for v1. */
  try {
    speak("");
    const shot = document.createElement("canvas");
    shot.width = video.videoWidth;
    shot.height = video.videoHeight;
    shot.getContext("2d").drawImage(video, 0, 0, shot.width, shot.height);

    const blob = await new Promise((res) => shot.toBlob(res, "image/jpeg", 0.95));
    if (!blob) return;

    await fetch("/capture", {
      method: "POST",
      headers: {"Content-Type": "image/jpeg"},
      body: blob,
    });
    log(`captured ${shot.width}x${shot.height}, ${(blob.size / 1024) | 0} kB`);
    setBanner("Captured", "running");
    setTimeout(() => { if (running) setBanner("Running", "running"); }, 1200);
  } catch (e) {
    log("capture failed: " + e.message);
  }
}

/* ---------------------------------------------------------------- */
/* the run                                                          */
/* ---------------------------------------------------------------- */

function tickHud() {
  const t = now();
  if (t - lastFpsAt >= 1000) {
    const fps = (framesSent - lastFpsCount) * 1000 / (t - lastFpsAt);
    lastFpsAt = t; lastFpsCount = framesSent;
    setCell("fps", fps.toFixed(1), fps >= 9 ? "ok" : fps >= 6 ? "warn" : "bad");
  }
  const skipPct = framesSent + framesSkipped > 0
    ? (100 * framesSkipped / (framesSent + framesSkipped)) : 0;
  setCell("drop", skipPct.toFixed(0) + "%", skipPct < 15 ? "ok" : skipPct < 40 ? "warn" : "bad");

  const buffered = ws ? ws.bufferedAmount : 0;
  latencyMs = buffered / 4000;   /* rough: kB queued / uplink kB per ms */
  setCell("lat", buffered > 0 ? (buffered / 1024).toFixed(0) + "k" : "0k",
          buffered < 60000 ? "ok" : "warn");
}

async function startRun() {
  if (running) return;
  el("start").disabled = true;
  try {
    setBanner("Starting...", "");
    await startCamera();
    await requestMotion();
    await acquireWakeLock();
    running = true;
    connect();
    startRecognition();

    setInterval(captureFrame, 1000 / CONFIG.frameHz);
    setInterval(tickHud, 250);
    setBanner("Running", "running");
    el("start").textContent = "Stop";
    el("start").disabled = false;
    el("start").className = "";
    el("start").onclick = () => stopRun("stopped on the phone");
  } catch (e) {
    setBanner("Failed: " + e.message, "error");
    log("startup failed: " + e.message);
    el("start").disabled = false;
  }
}

function stopRun(why) {
  running = false;
  setBanner("Stopped", "");
  log(why || "stopped");
  try { if (recognizer) recognizer.stop(); } catch (e) {}
  try { if (wakeLock) wakeLock.release(); } catch (e) {}
  if (ws) try { ws.close(); } catch (e) {}
  if (stream) stream.getTracks().forEach((t) => t.stop());
  el("start").textContent = "Start";
  el("start").className = "primary";
  el("start").onclick = startRun;
}

/* CO-5: a tap before walking away is one of the two ways to start a run. */
el("stage").addEventListener("click", () => {
  if (running) { send({type: "tap"}); log("tap sent"); }
});

el("start").onclick = startRun;
setCell("link", "off", "");
log("ready - tap Start, then accept the camera and motion prompts");
</script>
</body>
</html>
